<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload=""
>
  <groupbox>
    <label><html:h2>Batch Open</html:h2></label>

    <label value="When an item has no usable URL:" />
    <radiogroup preference="extensions.zotero.batchopen.fallback">
      <radio value="scholar" label="Search Google Scholar" />
      <radio value="web" label="Search the web (using the template below)" />
      <radio value="none" label="Skip the item" />
    </radiogroup>
    <description class="tip">
      Applies only to "Open all in browser." The two search commands always
      search, regardless of this setting.
    </description>

    <hbox align="center">
      <label value="Web search template:" control="batchopen-pref-template" />
      <html:input
        id="batchopen-pref-template"
        type="text"
        style="flex: 1"
        preference="extensions.zotero.batchopen.searchTemplate"
        placeholder="https://www.google.com/search?q={query}"
      />
    </hbox>
    <description class="tip">
      Must be an http(s) URL containing the literal text {query}, which is
      replaced with the URL-encoded search terms. An invalid template falls back
      to the default with a warning.
    </description>

    <hbox align="center">
      <label
        value="Confirm before opening more than:"
        control="batchopen-pref-confirm"
      />
      <html:input
        id="batchopen-pref-confirm"
        type="number"
        min="1"
        max="1000"
        preference="extensions.zotero.batchopen.confirmAbove"
      />
      <label value="items" />
    </hbox>
    <description class="tip">
      A confirmation prompt names the exact number of tabs before they open.
    </description>

    <hbox align="center">
      <label value="Delay between tabs (ms):" control="batchopen-pref-delay" />
      <html:input
        id="batchopen-pref-delay"
        type="number"
        min="0"
        max="10000"
        preference="extensions.zotero.batchopen.delayMs"
      />
    </hbox>
    <description class="tip">
      Staggers opening so a large batch does not arrive all at once (and so
      Google Scholar does not serve a CAPTCHA).
    </description>

    <hbox align="center">
      <label
        value="Reconcile window (minutes):"
        control="batchopen-pref-reconcile-window"
      />
      <html:input
        id="batchopen-pref-reconcile-window"
        type="number"
        min="1"
        max="10080"
        preference="extensions.zotero.batchopen.reconcileWindowMinutes"
      />
    </hbox>
    <description class="tip">
      "Attach newly saved files to the selected items" only looks at items added
      to your library within this many minutes ago when searching for a
      connector-created duplicate to merge.
    </description>

    <separator />

    <checkbox
      label="Reconcile items saved via the connector remote trigger"
      preference="extensions.zotero.batchopen.reconcileSavedItems"
    />
    <description class="tip">
      When on (the default), a "Save selected via connector" job moves the
      saved PDF onto the item you already had and trashes the new duplicate
      -- this keeps that item's collections, tags, notes, and its Better
      BibTeX citation key intact. Turn it off if you use a duplicate-merging
      plugin (e.g. Zoplicate) instead: the new item is then left as-is for
      that plugin to merge on its own schedule, but which item survives a
      merge -- and so whether a citation key changes -- is then that
      plugin's decision, not this one's. If you cite from Zotero into a
      manuscript via Better BibTeX, an unexpected citation-key change is
      usually more disruptive than a duplicate sitting in your library
      briefly, which is why this defaults to on.
    </description>

    <hbox align="center">
      <label
        value="Wait for the saved file (ms):"
        control="batchopen-pref-attachment-wait"
      />
      <html:input
        id="batchopen-pref-attachment-wait"
        type="number"
        min="1000"
        max="300000"
        preference="extensions.zotero.batchopen.attachmentWaitMs"
      />
    </hbox>
    <description class="tip">
      Zotero saves a new item's file a moment after the item itself appears,
      so reconciling waits up to this long (polling in the background) for
      it to show up before giving up. Only used when reconciliation (above)
      is on.
    </description>
  </groupbox>
</vbox>
